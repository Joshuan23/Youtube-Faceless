channel:
  name: "Twinkle Tots"
  tagline: "Sing-along nursery rhymes & lullabies for little ones"
  niche: "nursery_rhymes"       # nursery_rhymes | lullabies | learning_songs
  made_for_kids: true           # REQUIRED by COPPA/YouTube for children's content
  upload_time: "16:00"          # 4 PM — after-school / pre-dinner kids viewing window
  videos_per_week: 5

niches:
  nursery_rhymes:
    avg_cpm: 3.5                 # USD per 1000 views (kids content has low CPM but huge volume)
    target_views_per_video: 500000
    optimal_video_length_min: 3   # single rhyme; compilations run longer
    youtube_category: "1"         # Film & Animation
    topics:
      - "Twinkle Twinkle Little Star"
      - "Baby Shark Dance"
      - "The Wheels on the Bus"
      - "Old MacDonald Had a Farm"
      - "Row Row Row Your Boat"
      - "Five Little Ducks"
      - "If You're Happy and You Know It"
      - "Head Shoulders Knees and Toes"
      - "The Itsy Bitsy Spider"
      - "Rain Rain Go Away"

  lullabies:
    avg_cpm: 3.0
    target_views_per_video: 300000
    optimal_video_length_min: 5   # calmer, longer sleep songs
    youtube_category: "10"        # Music
    topics:
      - "Hush Little Baby"
      - "Rock-a-bye Baby"
      - "Brahms Lullaby"
      - "Twinkle Twinkle bedtime version"
      - "Sleepy time counting sheep song"

  learning_songs:
    avg_cpm: 4.0
    target_views_per_video: 400000
    optimal_video_length_min: 3
    youtube_category: "27"        # Education
    topics:
      - "ABC Alphabet Song"
      - "Counting 1 to 10 Song"
      - "Colors Song for Kids"
      - "Days of the Week Song"
      - "Shapes Song for Toddlers"

video:
  resolution: "1920x1080"
  fps: 30
  background_color: "#7EC8F3"     # cheerful sky blue
  text_color: "#FFFFFF"
  accent_color: "#FF5FA2"         # bubblegum pink
  font_size_title: 84
  font_size_body: 52
  fade_duration: 0.5              # seconds
  background_music_volume: 0.10

thumbnail:
  width: 1280
  height: 720
  background_color: "#7EC8F3"
  title_color: "#FFEB3B"          # sunny yellow
  subtitle_color: "#FFFFFF"
  border_color: "#FF5FA2"
  border_width: 12
  brand: "Twinkle Tots"

seo:
  title_max_chars: 70
  description_min_chars: 300
  max_tags: 15
  chapters: false                 # single rhymes rarely need chapters

tts:
  provider: "edge_tts"            # elevenlabs | edge_tts | openai | gtts
  # Warm, friendly voice suited to reading/singing nursery rhymes to children.
  edge_voice: "en-US-AnaNeural"   # child-like, gentle — great for rhymes
  speed: 1.0
  elevenlabs:
    model: "eleven_turbo_v2_5"
    stability: 0.4
    similarity_boost: 0.85
  openai:
    model: "tts-1-hd"
    voice: "shimmer"              # soft, higher-pitched, friendly
